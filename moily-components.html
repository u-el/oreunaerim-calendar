<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>moily. Components</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="moily-design.css?v=1"><style>*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:clamp(16px,4vw,32px);display:grid;gap:24px}h1,p{margin:0}.review-row{display:flex;gap:8px;flex-wrap:wrap}.review-row .moily-button{width:160px}.review-row.days{flex-wrap:nowrap}.review-row.days button{flex:1;min-width:0;max-width:44px}</style></head><body class="moily" data-theme="light"><main><h1 class="moily-display">03 / Components</h1><label>테마 <select id="theme"><option value="light">라이트</option><option value="dark">다크</option><option value="system">시스템</option></select></label><div id="buttons" class="review-row"></div><p id="feedback" role="status">컴포넌트 테스트용 화면입니다.</p><div id="field"></div><div id="chip"></div><div id="schedule"></div><div id="club"></div><div id="goal"></div><div id="days" class="review-row days"></div><div id="nav"></div><a href="./">기존 테스트 사이트로 돌아가기</a></main><script type="module">
import * as c from './moily-components.mjs';
const $=id=>document.getElementById(id), say=t=>$('feedback').textContent=t;
$('theme').addEventListener('change',e=>document.body.dataset.theme=e.target.value);
$('buttons').append(c.button('일정 등록',{onClick:()=>say('등록 버튼 테스트')}),c.button('취소',{variant:'secondary',onClick:()=>say('취소 버튼 테스트')}),c.button('일정 등록',{disabled:true}));
$('field').append(c.input('일정 이름',{placeholder:'일정 이름을 입력하세요',onInput:v=>say(v)}));
$('chip').append(c.chip('예정'));$('schedule').append(c.scheduleCard({date:'12월 25일 · 금요일',title:'신시도 월영산',subtitle:'오르내림 · 산행'}));$('club').append(c.clubCard({type:'등산 동호회',title:'오르내림',summary:'다가오는 일정 3개'}));$('goal').append(c.goalCard({title:'섬앤산',current:13,target:100}));
function days(selected){$('days').replaceChildren(...Array.from({length:7},(_,i)=>c.calendarDay({date:i+21,hasEvent:i===4,selected:i+21===selected,onSelect:d=>{days(d);say(d+'일 선택');}})));}
function nav(active){$('nav').replaceChildren(c.navigation(['홈','동호회','캘린더','활동 기록','마이'].map((label,i)=>({label,active:i===active,onSelect:()=>{nav(i);say(label+' 메뉴 선택');}}))));}
days(null);nav(0);
</script></body></html>
